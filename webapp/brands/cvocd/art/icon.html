<!doctype html>
<!-- App icon (favicon PNG/ICO, Apple touch icon): "cv." in the typewriter face of
     the cv.ocd wordmark, with its red dot, on the page's near-black. Rendered by
     tools/make-brand-images.mjs at each size; ?square drops the rounded corners. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=block">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
  .tile {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #111213;
    border-radius: 18%;
    overflow: hidden;
  }
  .square .tile { border-radius: 0; }
  .mark {
    font: 54vh/1 "Special Elite", "Courier New", monospace;
    color: #f1f2ec;
    letter-spacing: -0.06em;
    margin: -0.1em 0 0 0; /* optical centre: the glyphs sit low */
  }
  .dot { color: #e5483e; }
</style>
</head>
<body>
<div class="tile"><span class="mark">cv<span class="dot">.</span></span></div>
<script>if (location.search.includes('square')) document.documentElement.className = 'square';</script>
</body>
</html>
