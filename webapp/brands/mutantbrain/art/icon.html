<!doctype html>
<!-- App icon (favicon PNG/ICO, Apple touch icon): the Hexinverter emblem in white
     on the page charcoal. Rendered by tools/make-brand-images.mjs at each size;
     ?square drops the rounded corners (iOS rounds Apple touch icons itself). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; }
  .tile {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #1e2124;
    border-radius: 18%;
  }
  .square .tile { border-radius: 0; }
  /* favicon.svg follows the colour scheme; the renderer uses dark, so it is white here */
  .tile img { width: 76%; height: 76%; }
</style>
</head>
<body>
<div class="tile"><img src="../favicon.svg" alt=""></div>
<script>if (location.search.includes('square')) document.documentElement.className = 'square';</script>
</body>
</html>
