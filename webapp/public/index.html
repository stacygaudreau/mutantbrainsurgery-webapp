<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutant Brain Surgery</title>
<meta name="description" content="SysEx Patch Builder for the Hexinverter Mutant Brain Eurorack Module">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="preload" href="fonts/noyh_black-webfont.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav-bar">
  <a class="nav-bar__logo" href="https://www.hexinverter.net/"><img src="img/hexinverter-logo.svg" alt="Hexinverter Électronique"></a>
</header>

<!-- Hero: space background that fades into the page colour where the editor begins -->
<section class="hero">
  <div class="page__inner hero__inner">
    <header class="page-heading">
      <h1 class="page-heading__title">Mutant Brain Surgery</h1>
      <h2 class="page-heading__subtitle">SysEx Patch Builder for the Mutant Brain Eurorack Module</h2>
    </header>
    <!-- any orientation works: the image is scaled to fit -->
    <figure class="module-shot">
      <picture>
        <source srcset="img/mutantbrain-black.webp" type="image/webp">
        <img class="logo" src="img/mutantbrain-black.png" alt="Mutant Brain module, black front panel">
      </picture>
    </figure>
    <noscript><p class="status status--error">This page needs JavaScript enabled.</p></noscript>
  </div>
</section>

<main class="page">
  <!-- icons (24px outline style, drawn with the text colour) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 19V6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v3"/><path d="M3 19l3-8h16l-3 8z"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><path d="M7 21v-7h10v7"/></symbol>
  </svg>
  <div class="page__inner">
    <form id="sysex" action="#" autocomplete="off">
      <!-- first row of panes: loading/clearing beside the global settings -->
      <div class="pane-row">
        <section id="patch-pane" class="block info-panel loader" aria-labelledby="patch-title">
          <h3 id="patch-title" class="info-panel__header">Load Patch</h3>
          <div class="loader__body">
            <p id="intro-empty">Open a Mutant Brain SysEx file to edit it, or start a new patch from scratch!</p>
            <p id="intro-loaded" hidden><strong>Editing patch</strong>. Download it to save it, or create a new patch to start over.</p>
            <div class="field">
              <label for="patch-name" class="field__label">Patch name</label>
              <!-- shows the name as text; clicking it (or the pencil) edits it -->
              <div class="field__input">
                <input type="text" id="patch-name" class="text-input" autocomplete="off" spellcheck="false" maxlength="120">
                <button type="button" id="rename" class="icon-btn" title="Edit patch name" aria-label="Edit patch name">
                  <svg class="icon" aria-hidden="true"><use href="#i-pencil"/></svg>
                </button>
              </div>
            </div>
            <input type="file" id="file" class="visually-hidden" accept=".syx,application/octet-stream">
            <label for="file" id="open" class="btn btn--teal btn--icon" role="button" tabindex="0">
              <svg class="icon" aria-hidden="true"><use href="#i-open"/></svg><span>Open</span>
            </label>
            <div class="btn-pair">
              <button type="button" id="new" class="btn btn--black btn--icon">
                <svg class="icon" aria-hidden="true"><use href="#i-new"/></svg><span>New</span>
              </button>
              <button type="button" id="reset" class="btn btn--black btn--icon">
                <svg class="icon" aria-hidden="true"><use href="#i-clear"/></svg><span>Clear</span>
              </button>
            </div>
            <p id="load-error" class="status status--error" role="alert" hidden>ERROR IN SYSEX FILE - NOT LOADED!! <span id="load-error-detail"></span></p>
          </div>
        </section>
        <div id="slot-globals" class="pane-row__slot"></div>
      </div>
      <div id="sections"></div>
      <div class="actions">
        <button type="submit" class="btn btn--accent btn--icon go">
          <svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span>Download SysEx</span>
        </button>
      </div>
    </form>
  </div>
</main>

<!-- app.js is built from src/ by `npm run build` -->
<script src="app.js"></script>
</body>
</html>
